packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@arcgis/core": ~5.2.0
  "@arcgis/map-components": ~5.2.0
  "@esri/calcite-components": ~5.2.0
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@vaadin/vaadin-usage-statistics": true
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.5.0 || 1.5.1"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.5.0 || 1.5.1"
  - "@voidzero-dev/vite-plus-darwin-x64@1.5.0 || 1.5.1"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.5.0 || 1.5.1"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.5.0 || 1.5.1"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.5.0 || 1.5.1"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.5.0 || 1.5.1"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.5.0 || 1.5.1"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.5.0 || 1.5.1"
  - vite-plus@1.5.0 || 1.5.1
