packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@arcgis/core": ~5.2.0-next.161
  "@arcgis/map-components": ~5.2.0-next.161
  "@esri/calcite-components": ~5.2.0
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@vaadin/vaadin-usage-statistics": true
minimumReleaseAgeExclude:
  - "@arcgis/common-components@5.2.0-next.161"
  - "@arcgis/core@5.2.0-next.161"
  - "@arcgis/lumina-toolkit@5.2.0-next.161"
  - "@arcgis/lumina@5.2.0-next.161"
  - "@arcgis/map-components@5.2.0-next.161"
  - "@arcgis/toolkit@5.2.0-next.161"
