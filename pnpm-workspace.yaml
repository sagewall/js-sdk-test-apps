packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@arcgis/core": 5.2.0-next.126
  "@arcgis/map-components": 5.2.0-next.126
  "@esri/calcite-components": 5.2.0-next.80
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@vaadin/vaadin-usage-statistics": true
